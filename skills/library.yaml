# kcp-skill curated library — merge these units into a project manifest, or
# reference this file from a federated root. Spec: KCP v0.26 §4.3a.
kcp_version: "0.26"
project: kcp-skill-library
version: 0.1.0
language: en
units:
  - id: rotate-signing-key
    path: rotate-signing-key/SKILL.md
    kind: skill
    intent: "How do I rotate the manifest signing key safely?"
    scope: project
    audience: [agent, operator]
    triggers: [rotate, signing-key, ed25519, key-rotation]
    action_scope:
      tools: [kcp-sign, git]
      paths: ["knowledge.yaml", "knowledge.yaml.sig", ".well-known/kcp-signing-key"]
      capabilities: [key-management]

  - id: dependency-bump
    path: dependency-bump/SKILL.md
    kind: skill
    intent: "How do I bump a dependency and verify nothing broke?"
    scope: project
    audience: [agent, operator]
    triggers: [dependency, bump, upgrade, pin, renovate]
    action_scope:
      tools: [read, bash, git]
      paths: ["pom.xml", "package.json", "package-lock.json", "bun.lock", "go.mod", "go.sum", "Cargo.toml", "Cargo.lock", "requirements*.txt", ".github/workflows/**"]
      capabilities: []

  - id: release-and-tag
    path: release-and-tag/SKILL.md
    kind: skill
    intent: "How do I cut a release and tag it safely?"
    scope: project
    audience: [agent, operator]
    triggers: [release, tag, version, changelog]
    action_scope:
      tools: [read, bash, edit, git]
      paths: ["pom.xml", "package.json", "CHANGELOG.md", "RELEASE.md"]
      capabilities: [release]
