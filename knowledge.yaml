# kcp-skill is KCP-adopted: this manifest makes the governed-skill layer
# navigable by any KCP agent. The curated library itself lives in
# skills/library.yaml and is reachable as a unit here.
kcp_version: "0.30"
project: kcp-skill
version: 0.2.0
language: en

trust:
  provenance:
    publisher: "eXOReaction AS / Cantara"

units:
  - id: front-door
    path: README.md
    kind: knowledge
    intent: "What is kcp-skill and which layer of the KCP stack does it own?"
    scope: global
    audience: [agent, human]
    triggers: [overview, linter, vectors, library, governed-skill]

  - id: authoring-profile
    path: PROFILE.md
    kind: policy
    intent: "What does a well-authored governed skill unit look like (action_scope as a firewall rule)?"
    scope: global
    audience: [agent, human]
    triggers: [authoring, profile, action_scope, envelope, conventions, SK001]

  - id: skill-library
    path: skills/library.yaml
    kind: schema
    intent: "Which curated governed skills are available to merge or federate into a project manifest?"
    scope: global
    audience: [agent]
    triggers: [library, curated, skills, rotate-signing-key, dependency-bump, release-and-tag]

  # The library's three skills, governed in this repo's own manifest. The README used
  # rotate-signing-key as its worked example of a governed unit while the manifest never
  # declared it — the conventions repo now follows its own convention. Tool vocabulary is
  # the library's own (command-level), per PROFILE.md.

  - id: rotate-signing-key
    path: skills/rotate-signing-key/SKILL.md
    kind: skill
    intent: "How do I rotate the manifest signing key safely, with no window where consumers see an unverifiable manifest?"
    scope: project
    audience: [agent, operator]
    triggers: [rotate, signing-key, ed25519, key-rotation]
    load_eligible: true
    action_scope:
      tools: [kcp-sign, git]
      paths: ["knowledge.yaml", "knowledge.yaml.sig", ".well-known/kcp-signing-key"]
      capabilities: [key-management]
    content_hash:
      algorithm: sha256
      value: "7ca22ce0a89942ab0d5923199adfc2cf6cb26eac4f96925ea0a439bf288ae2dd"

  - id: dependency-bump
    path: skills/dependency-bump/SKILL.md
    kind: skill
    intent: "How do I bump one dependency pin and prove the project still holds, before merge?"
    scope: project
    audience: [agent, operator]
    triggers: [dependency, bump, upgrade, pin, renovate]
    load_eligible: true
    action_scope:
      tools: [read, bash, git]
      paths: ["pom.xml", "package.json", "package-lock.json", "bun.lock", "go.mod", "go.sum", "Cargo.toml", "Cargo.lock", "requirements*.txt", ".github/workflows/**"]
      capabilities: []
    content_hash:
      algorithm: sha256
      value: "9c670e82459a14be373f6193b2c59f1e60c0a797df1025fb948a6779136cb4c4"

  - id: release-and-tag
    path: skills/release-and-tag/SKILL.md
    kind: skill
    intent: "How do I cut a release — version bump, changelog, tag — without shipping an unverified artifact?"
    scope: project
    audience: [agent, operator]
    triggers: [release, tag, version, changelog]
    load_eligible: true
    action_scope:
      tools: [read, bash, edit, git]
      paths: ["pom.xml", "package.json", "CHANGELOG.md", "RELEASE.md"]
      capabilities: [release]
    content_hash:
      algorithm: sha256
      value: "6490cd219b643fb9e95a6751bf788fcfc7fd8bc4fcbd9001caad147c4cfff401"

signing:
  scheme: ed25519
  scope: this-manifest
  public_key: "MCowBQYDK2VwAyEAuipgusnqU9vjf3p2yPVLD/DmERT6tBbLOqEETdxAhMU="
  signature: "knowledge.yaml.sig"

# Serving Endpoint Binding (KCP SPEC v0.26 §3.12): authoritative manifest URL.
# Ignored by pre-0.26 verifiers.
serving:
  manifest:
    - https://raw.githubusercontent.com/Cantara/kcp-skill/main/knowledge.yaml
