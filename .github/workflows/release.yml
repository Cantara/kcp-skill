name: Release

# Cut a release by hand: verifies the target ref, tags it, and creates a
# GitHub release with generated notes. Mirrors the pi-kcp release flow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.1.0)"
        required: true
      target:
        description: "Ref to tag"
        required: false
        default: "main"

permissions:
  contents: write # push the tag, create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node bin/lint.mjs --vectors
      - run: node bin/lint.mjs skills/library.yaml

      # Idempotent: skip tag creation if it already exists (e.g. re-running
      # after a failed later step).
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag ${{ inputs.version }} already exists; skipping."
          else
            git tag "${{ inputs.version }}"
            git push origin "refs/tags/${{ inputs.version }}"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Release ${{ inputs.version }} already exists; skipping."
          else
            gh release create "${{ inputs.version }}" --generate-notes --title "${{ inputs.version }}"
          fi
