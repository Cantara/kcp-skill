name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-nul-bytes.sh
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Conformance vectors
        run: node bin/lint.mjs --vectors
      - name: Library is clean
        run: node bin/lint.mjs skills/library.yaml
