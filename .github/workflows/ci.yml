name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: ./scripts/check-nul-bytes.sh
      - name: Colocation (skill change ships with library.yaml)
        run: ./scripts/check-colocation.sh "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Vocabulary (playbook names a protocol kind, §4.3b)
        run: node bin/check-vocabulary.mjs
      - name: Conformance vectors
        run: node bin/lint.mjs --vectors
      - name: Library is clean
        run: node bin/lint.mjs skills/library.yaml
